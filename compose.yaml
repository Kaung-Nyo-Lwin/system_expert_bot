services:
  backend:
    build: .
    environment:
      APP_MODE: demo
    volumes:
      - documents:/app/app/backend/static/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build: app/frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  documents:
